<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f7fb;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .dashboard-card {
            padding: 25px;
        }

        .table {
            vertical-align: middle;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">
            📚 Library Management
        </a>

        <div>
            <a href="{% url 'students' %}" class="btn btn-outline-light btn-sm">
                Students
            </a>

            <a href="{% url 'teachers' %}" class="btn btn-outline-light btn-sm">
                Teachers
            </a>

            <a href="{% url 'books' %}" class="btn btn-outline-light btn-sm">
                Books
            </a>

            <a href="{% url 'issued_books' %}" class="btn btn-outline-light btn-sm">
                Issued Books
            </a>
        </div>
    </div>
</nav>


<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
