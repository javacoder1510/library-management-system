{% extends "library/base.html" %}

{% block content %}

<h2>
    {% if teacher %}
        Edit Teacher
    {% else %}
        Add Teacher
    {% endif %}
</h2>

<div class="card shadow mt-3">
    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label>Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ teacher.name|default:'' }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ teacher.email|default:'' }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label>Phone</label>
                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    value="{{ teacher.phone|default:'' }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label>Department</label>
                <input
                    type="text"
                    name="department"
                    class="form-control"
                    value="{{ teacher.department|default:'' }}"
                    required
                >
            </div>

            <button class="btn btn-success">
                Save
            </button>

            <a href="{% url 'teachers' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

{% endblock %}
